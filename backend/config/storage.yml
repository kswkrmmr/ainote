test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Cloudflare R2 はS3互換なので、AWS S3のサービスにR2のエンドポイントを指定して使う。
# R2はリージョンの概念がないため region は "auto" 固定。
# 環境変数は Render のダッシュボードで設定する。
cloudflare:
  service: S3
  access_key_id: <%= ENV["R2_ACCESS_KEY_ID"] %>
  secret_access_key: <%= ENV["R2_SECRET_ACCESS_KEY"] %>
  endpoint: <%= ENV["R2_ENDPOINT"] %>
  bucket: <%= ENV["R2_BUCKET"] %>
  region: auto
  # R2はパス形式のURL(<endpoint>/<bucket>/<key>)のみ対応
  force_path_style: true
